<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Image</title>
  </head>
  <body>
    <!-- Penggunaan Local -->
    <img
      src="./image/PASFOTO RESMI.jpeg"
      alt="Foto Ibrahim Apri Falah"
      width="300"
    />

    <!-- Membungkus tag img di dalam tag a -->
    <a href="https://wpucourse.id/##about" target="_blank">
      <!-- Penggunaan URL -->
      <img
        src="https://wpucourse.id/about/sandhika-1.png"
        alt="Foto Sandhika Galih"
        width="300"
      />
    </a>
  </body>
</html>
