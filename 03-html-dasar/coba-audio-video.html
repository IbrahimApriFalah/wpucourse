<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Rich Media Tag</title>
  </head>
  <body>
    <h3>Keyboard ASMR⌨️🔊</h3>
    <!-- Atribut controls digunakan untuk menambahkan tombol kontrol seperti play, pause, dan volume control pada video. -->
    <!-- Atribut poster digunakan untuk menampilkan gambar poster sebelum video dimainkan. -->
    <video controls poster="media/desk-setup-thumb.jpg" width="300">
      <!-- Atribut source digunakan untuk menentukan sumber video. -->
      <source type="video/mp4" src="media/keyboard-asmr.mp4" />
      <source type="video/mp4" src="media/keyboard-asmr.webm" />
      Browser belum support video player
    </video>
    <hr />
    <br />

    <h3>Lofi Playlist🎧</h3>
    <audio controls="">
      <source src="media/moderation.mp3" />
      Browser tidak mendukung audio player
    </audio>
  </body>
</html>
