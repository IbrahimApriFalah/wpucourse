<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote</title>
    <style>
      body {
        font-family: "Corier New";
        font-weight: bold;
        color: rgb(61, 61, 61);
        text-align: center;
      }

      h1 {
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: rgb(100, 100, 100);
        text-shadow: 5px 5px 0 rgb(222, 222, 222);
      }

      .lirik {
        font-size: 22px;
        line-height: 2.5;
        word-spacing: 5px;
      }

      span {
        color: rgb(188, 188, 188);
        text-decoration: line-through;
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(150, 150, 150);
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <h1>fase runtuh</h1>
    <p class="lirik">
      "Tak perlu khawatir, ku hanya <span>terluka</span>. <br />
      Terbiasa tuk pura-pura terluka. <br />
      Namun bolehkah sekali saja ku menangis? <br />
      Sebelum kembali membohongi diri."
    </p>
    <p class="credit">-feaby putri feat. fiersa besari</p>
  </body>
</html>
