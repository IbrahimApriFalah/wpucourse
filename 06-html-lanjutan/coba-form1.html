<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Elemen Form</title>
  </head>
  <body>
    <h1>Coba Elemen - elemen form pada HTML</h1>

    <form>
      <label for="nama">Nama</label>
      <input type="text" name="nama" id="nama" placeholder="Masukkan Nama" />
      <br />

      <label for="password">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        placeholder="Masukkan Password"
      />
      <br />

      <label for="email">Email</label>
      <input
        type="email"
        name="email"
        id="email"
        placeholder="Masukkan Email"
      />
      <br />

      <label for="number">Angka</label>
      <input
        type="number"
        name="angka"
        id="number"
        min="0"
        max="100"
        step="5"
      />
      <br />

      <label for="date">Tanggal</label>
      <input type="date" name="date" id="date" />
      <br />

      <label for="color">Pilih Warna</label>
      <input type="color" name="color" id="color" />
      <br />

      <label for="url">URL</label>
      <input type="url" name="url" id="url" placeholder="Masukkan URL" />
      <br />

      <label for="tel">Telelpon</label>
      <input type="tel" name="tel" id="tel" placeholder="Masukkan Nomor Telepon" />
      <br />

      <label for="file">File</label>
      <input type="file" name="file" id="file" />
      <br />

      <h3>Jenis Kelamin</h3>
      <label for="radio1">Pria</label>
      <input type="radio" name="jenis-kelamin" id="pria" value="pria" />
      <br />
      <label for="radio2">Wanita</label>
      <input type="radio" name="jenis-kelamin" id="wanita" value="wanita" />
      <br />

      <h3>Hobi</h3>
      <label for="hobi1">Badminnton</label>
      <input type="checkbox" name="hobi1" id="hobi1" value="badminton" />
      <br />
      <label for="hobi2">Basket</label>
      <input type="checkbox" name="hobi2" id="hobi2" value="basket" />
      <br />
      
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
